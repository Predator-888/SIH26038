services:
  # 1. Backend FastAPI Service
  - type: web
    name: sih26038-backend-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Frontend React/Vite Static Site
  - type: static
    name: sih26038-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://netraai-8vlw.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

